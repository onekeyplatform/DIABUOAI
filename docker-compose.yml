version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: diabuoai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diabuoai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: diabuoai-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: diabuoai-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: diabuoai-api
    restart: unless-stopped
    env_file:
      - apps/api/.env.example
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/diabuoai?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - redis

  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    container_name: diabuoai-workers
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    container_name: diabuoai-agent
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/diabuoai?schema=public
    depends_on:
      - postgres
      - redis

  prometheus:
    image: prom/prometheus:latest
    container_name: diabuoai-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: diabuoai-grafana
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: diabuoai-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_data:
