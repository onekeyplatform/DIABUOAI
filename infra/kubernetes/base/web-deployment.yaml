apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: diabuoai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: diabuoai/web:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: diabuoai-config
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: diabuoai
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 3000
