apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: diabuoai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: diabuoai/api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: diabuoai-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: diabuoai
spec:
  selector:
    app: api
  ports:
    - port: 4000
      targetPort: 4000
